name: MSPCA Scraper

on:
  schedule:
    # DST (EDT) schedule: 8:00am and 5:00pm Eastern == 12:00 and 21:00 UTC.
    - cron: "0 12,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 beautifulsoup4==4.14.3 pandas==3.0.1

      - name: Restore hypo state
        uses: actions/cache/restore@v4
        with:
          path: .state/mspca_hypo_state.json
          key: mspca-hypo-state-${{ github.run_id }}
          restore-keys: |
            mspca-hypo-state-

      - name: Run scraper
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scrape_mspca_final.py

      - name: Save hypo state
        if: always() && hashFiles('.state/mspca_hypo_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/mspca_hypo_state.json
          key: mspca-hypo-state-${{ github.run_id }}
